name: Generate Market Strip

on:
  workflow_run:
    workflows: ["BMS DailyBO 1to9 + Combine (Matrix)"]
    types:
      - completed
  workflow_dispatch:                        # Allow manual triggering

permissions:
  contents: write                           # Required to commit and push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0                     # Full history for proper diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          # No external dependencies required by marketstrip.py

      - name: Run market strip generator
        run: |
          python marketstrip.py

      - name: Commit and push if changed (with retry & force push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the file
          git add data/marketstrip.json

          # If nothing changed, exit early
          if git diff --staged --quiet; then
            echo "No changes to marketstrip.json"
            exit 0
          fi

          # Commit
          git commit -m "chore: update marketstrip.json [skip ci]"

          # ----- Retry loop with force push -----
          MAX_RETRIES=5
          RETRY=0
          SUCCESS=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "🔄 Push attempt $((RETRY+1))/$MAX_RETRIES"

            # Fetch latest from origin/main
            git fetch origin main

            # Rebase our commit on top of latest main (to avoid conflicts)
            if ! git rebase origin/main; then
              echo "⚠️ Rebase conflict – aborting and resetting to origin/main"
              git rebase --abort
              git reset --hard origin/main
              # Re‑apply our commit (cherry‑pick)
              git cherry-pick HEAD@{1}  # The commit we just made before rebase
            fi

            # Push with --force-with-lease (safe force)
            if git push --force-with-lease origin main; then
              echo "✅ Push successful"
              SUCCESS=1
              break
            else
              echo "⚠️ Push failed – retrying in 5 seconds..."
              RETRY=$((RETRY+1))
              sleep 5
            fi
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "❌ Push failed after $MAX_RETRIES attempts"
            exit 1
          fi
