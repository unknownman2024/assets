name: BMS 26 June Adv Runner

on:
  workflow_dispatch:
  schedule:
    # IST window mapped in UTC (every 2 hours window)
    - cron: "0 21-23/8,1-17/8 * * *"

permissions:
  contents: write

jobs:

# =====================================================
# 1️⃣ Decide DATE OFFSET + FREEZE DATE_CODE
# =====================================================
  decide-day:
    runs-on: ubuntu-latest
    outputs:
      days_ahead: ${{ steps.set.outputs.days_ahead }}
      date_code:  ${{ steps.set.outputs.date_code }}

    steps:
      - name: Decide tracking day (FREEZE to 2026-06-26)
        id: set
        run: |
          TARGET="2026-06-26"
          TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)

          DAYS_AHEAD=$(( ( $(date -d "$TARGET" +%s) - $(date -d "$TODAY" +%s) ) / 86400 ))

          if [ $DAYS_AHEAD -lt 0 ]; then
            DAYS_AHEAD=0
          fi

          DATE_CODE="20260626"

          echo "📅 Target date  : $TARGET"
          echo "📆 Today (IST)  : $TODAY"
          echo "⏳ Days ahead   : $DAYS_AHEAD"
          echo "🔒 DATE_CODE    : $DATE_CODE"

          echo "days_ahead=$DAYS_AHEAD" >> $GITHUB_OUTPUT
          echo "date_code=$DATE_CODE" >> $GITHUB_OUTPUT


# =====================================================
# 2️⃣ Run ALL shards in parallel (1–9)
# =====================================================
  shards:
    name: Shard ${{ matrix.shard }}
    needs: decide-day
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        shard: [1,2,3,4,5,6,7,8,9]

    steps:

      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🔄 Ensure latest main
        run: |
          git fetch origin
          git reset --hard origin/main

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cloudscraper aiohttp pytz selenium webdriver-manager

      - name: 🚀 Run shard scraper
        run: |
          python bmsrotate${{ matrix.shard }}.py
        env:
          DAYS_AHEAD: ${{ needs.decide-day.outputs.days_ahead }}
          DATE_CODE:  ${{ needs.decide-day.outputs.date_code }}
          WORKER_UA: ${{ secrets.WORKER_UA }}
          WORKER_KEY: ${{ secrets.WORKER_KEY }}

      - name: 💾 Commit shard output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add advance/data/${{ needs.decide-day.outputs.date_code }}/
          git commit -m "Shard ${{ matrix.shard }} data (${{ needs.decide-day.outputs.date_code }})" || exit 0

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            git push origin main && exit 0
            sleep 4
          done

          git push --force-with-lease origin main || true


# =====================================================
# 3️⃣ Combine shards
# =====================================================
  combine:
    name: Combine all shards (Safe)
    needs: [decide-day, shards]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: bms-adv-combiner
      cancel-in-progress: false

    steps:

      - name: 🧾 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🔁 Safe combine + push (retry loop)
        env:
          DATE_CODE: ${{ needs.decide-day.outputs.date_code }}
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          MAX_TRIES=6
          TRY=1

          while [ $TRY -le $MAX_TRIES ]; do

            echo "🔁 Combine attempt $TRY / $MAX_TRIES"

            git fetch origin main
            git reset --hard origin/main

            pip install pytz
            python combine_shards_rotate.py

            git add advance/data/${DATE_CODE}/

            if git diff --cached --quiet; then
              echo "✅ No changes after combine"
              exit 0
            fi

            git commit -m "Final combined BMS data (${DATE_CODE})"

            if git push origin main; then
              echo "✅ Combine push successful"
              exit 0
            fi

            echo "⚠ Push failed — main moved. Retrying..."
            TRY=$((TRY+1))
            sleep 5
          done

          echo "❌ Combine failed after $MAX_TRIES attempts"
          exit 1
